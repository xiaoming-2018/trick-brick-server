# Fly.io 部署配置。配合已有的 Dockerfile 使用。
# 注意:当前 Fly.io 对新账号不是无上限免费层,此配置更适合付费/试用部署。
# 部署时若 app 名被占用,fly launch 会提示改成唯一名(会自动更新此处)。
app = "trick-brick-server"
primary_region = "hkg"   # 香港,离国内近;可改 sin(新加坡)/nrt(东京)等

[build]
  # 使用仓库根目录的 Dockerfile

[env]
  PORT = "3000"
  GAME_DIR = ""                                  # 前端在 GitHub Pages,后端不托管静态
  CORS_ORIGIN = "https://wyuegood-afk.github.io" # 允许前端跨域

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false   # 关闭自动休眠 → 不休眠
  auto_start_machines = true
  min_machines_running = 1     # 始终保持 1 台运行

# 持久卷:SQLite 数据库挂在这里,重启/重新部署都不丢
[[mounts]]
  source = "tb_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
