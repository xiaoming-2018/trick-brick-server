# Render 部署蓝图(Blueprint)。
# 数据存 Render 免费 Postgres(下方 databases),Web 服务重启/重部署不丢数据。
# 注意:Render 免费 Postgres 约 30 天后过期会被删除,长期使用需升级。
databases:
  - name: trick-brick-db
    plan: free
    region: singapore
    databaseName: trickbrick
    user: trickbrick

services:
  - type: web
    name: trick-brick-server
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node src/app.js
    healthCheckPath: /api/levels/config
    envVars:
      # Postgres 连接串:由上方数据库自动注入(内部连接,无需手填)
      - key: DATABASE_URL
        fromDatabase:
          name: trick-brick-db
          property: connectionString
      # 管理后台口令:部署后在 Render 控制台手动填写(sync:false 不写进仓库)
      - key: ADMIN_PASSWORD
        sync: false
      # 登录令牌密钥 / IP 哈希盐:由 Render 自动生成随机值,无需手填
      - key: JWT_SECRET
        generateValue: true
      - key: IP_SALT
        generateValue: true
      # 允许跨域来源：* 表示任意来源（埋点/配置为公开接口、不带 cookie，放开安全）
      - key: CORS_ORIGIN
        value: "*"
      # 后端不再托管游戏前端(前端在 Pages),留空即可
      - key: GAME_DIR
        value: ""
