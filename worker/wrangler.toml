name = "trick-brick-server"
main = "src/index.js"
compatibility_date = "2025-01-01"

# 静态资源：把 admin 后台和游戏前端打包进 public-dist/ 后由 Workers Assets 直接托管。
# 命中静态文件的请求直接返回，不进 Worker；其余（/api/*、/）才进 Worker。
[assets]
directory = "./public-dist"
binding = "ASSETS"

# D1 数据库（SQLite）。database_id 用 `wrangler d1 create trick-brick` 生成后填入。
[[d1_databases]]
binding = "DB"
database_name = "trick-brick"
database_id = "PLACEHOLDER_RUN_wrangler_d1_create"

# 埋点接口限流（Cloudflare 原生 Rate Limiting，免费、无需写 D1）。
# period 仅支持 10 或 60 秒；这里 60s 内每个 IP 哈希最多 240 次，对齐原内存限流。
[[unsafe.bindings]]
name = "TRACK_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 240, period = 60 }

[vars]
# 游戏与后端同域部署时留空即可；跨域时填游戏来源，如 https://game.example.com
CORS_ORIGIN = ""

# 以下为机密，不写这里，用 `wrangler secret put <NAME>` 设置：
#   ADMIN_PASSWORD  管理后台登录口令
#   JWT_SECRET      HMAC 签名密钥（随机长字符串）
#   IP_SALT         IP 哈希加盐（随机长字符串）
