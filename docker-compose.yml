# 一键启动:docker compose up -d
# 游戏前端(../trick-brick)以只读卷挂载到容器 /game,由后端在 /game/ 路径托管。
# SQLite 数据持久化到宿主 ./data。
# 口令/密钥必须由宿主环境变量或同目录 .env 提供,生产禁止使用默认值。
services:
  trick-brick:
    build: .
    container_name: trick-brick-server
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATA_DIR: /app/data
      GAME_DIR: /game
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      IP_SALT: ${IP_SALT:?IP_SALT is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    volumes:
      - ./data:/app/data            # SQLite 持久化
      - ../trick-brick:/game:ro     # 游戏前端(只读)
    restart: unless-stopped
